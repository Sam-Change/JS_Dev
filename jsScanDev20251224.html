<!-- jsDev -->
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>jsDev</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; /* 關鍵：避免超出 */
    }

    th, td {
      border: 1px solid #333;
      padding: 6px;
      vertical-align: top;
      font-size: 14px;
      word-break: break-all;      /* 強制斷行 */
      overflow-wrap: break-word;  /* 長字串換行 */
    }

    th {
      text-align: center;
      font-weight: bold;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .col-title {
      width: 30%;
    }

    .col-content {
      width: 70%;
    }

    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
    }

    .time {
      font-size: 12px;
      color: gray;
      margin-top: 4px;
    }

    .img-container {
      width: 100%;           /* 占滿表格寬度 */
      height: 60px;          /* 你想顯示的高度 */
      overflow: hidden;       /* 超出的部分不顯示 */
      position: relative;
    }

    .img-container img {
      width: 100%;
      height: auto;           /* 保持比例 */
      display: block;
      transform: translateY(-40%); /* 向上移 40% 高度 → 顯示下半部 */
      object-fit: cover;      /* 保留比例，填滿容器 */
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 兩欄，平均分 */
      gap: 6px;                        /* 欄間距 */
    }

    .button-grid button {
      width: 100%; /* 撐滿欄位，但不換行 */
      padding: 8px;
      font-size: 14px;
    }

    /* 模擬掃碼區容器 */
    .scan-simulation {
      width: 100%;
      height: 144px; /* 大約三行按鈕高度 48px * 3 */
      display: flex;
      justify-content: center; /* 水平置中 */
      align-items: center;     /* 垂直置中 */
    }

    /* 正方形掃碼框 */
    .scan-box {
      width: 120px;  /* 可以依需求調整 */
      height: 120px;
      border: 2px solid green;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <table>
    <thead>
        <tr>
            <th colspan="2">jsScanDev2512291654</th>
        </tr>
    </thead>
    <tbody>
        <tr>
          <td colspan="2">
            <div class="img-container">
              <img src="https://raw.githubusercontent.com/Sam-Change/JS_Dev/5e1161f9161c1896cfca1c67119710f1ad2b0eaf/imgTest01.png">
            </div>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <button onclick="exitApp()">exitApp</button>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <!-- 掃碼區 -->
            <div class="scan-simulation">
              <div class="scan-box"></div>
            </div>
          </td>
        </tr>
        <tr>
          <td class="col-title">
            取得掃碼結果
            <div id="getScanResultTime" class="time"></div>
          </td>
          <td class="col-title">
            取得讀碼結果
            <div id="getPhotoResultTime" class="time"></div>
          </td>
        </tr>
        <tr>
          <td class="col-content" id="getScanResult">
            尚未掃碼
          </td>
          <td class="col-content" id="getPhotoResult">
            尚未選取照片
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <div class="button-grid">
              <button onclick="startScan('QR')">startScan[QR]</button>
              <button onclick="startScan('barcode')">startScan[barcode]</button>
            </div>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <div class="button-grid">
              <button onclick="setScanType('QR')">setScanType[QR]</button>
              <button onclick="setScanType('barcode')">setScanType[barcode]</button>
            </div>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <div class="button-grid">
              <button onclick="continueScan()">continueScan</button>
              <button onclick="stopScan()">stopScan</button>
            </div>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <div class="button-grid">
              <button onclick="openSettingPage()">openSettingPage</button>
              <button onclick="chooseFromAlbum()">chooseFromAlbum</button>
            </div>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            <div class="button-grid">
              <button onclick="setBrightest()">setBrightest</button>
              <button onclick="setOriginalBrightness(0.3)">setOriginalBrightness[0.3]</button>
            </div>
          </td>
        </tr>
    </tbody>
  </table>
  
  <script>
    var ideviceCheck = isiOSDevice();

    function isiOSDevice() {
      const mobileDevice = ['iPhone', 'iPad', 'iPod'];
      return mobileDevice.some(e => navigator.userAgent.match(e));
    }

    //=========================發JS=========================//

    // 開啟相機開始掃碼
    function startScan(type) {
      let rect = {
        top: 20,
        left: 20,
        width: 200,
        height: 200
      }

      let rectBarcode = {
        top: 20,
        left: 20,
        width: 200,
        height: 44
      }

      if (type === "barcode") {
        rect = rectBarcode
      }

      let packet_startScanData = {
        type: type,
        rect: rect
      };

      let packet_startScan = {
        action: "startScan",
        data: packet_startScanData
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_startScan)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.startScan(
            JSON.stringify(packet_startScan)
          );
        }
      }
    }

    // 設定掃描QRCode格式
    function setScanType(type) {
      let rect = {
        top: 20,
        left: 20,
        width: 200,
        height: 200
      }

      let rectBarcode = {
        top: 20,
        left: 20,
        width: 200,
        height: 44
      }

      if (type === "barcode") {
        rect = rectBarcode
      }

      let packet_setScanTypeData = {
        type: type,
        rect: rect
      };

      let packet_setScanType = {
        action: "setScanType",
        data: packet_setScanTypeData
      };

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_setScanType)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.setScanType(
            JSON.stringify(packet_setScanType)
          );
        }
      }
    }

    // 繼續掃碼
    function continueScan() {
      let packet_continueScan = {
        action: "continueScan"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_continueScan)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.continueScan(
            JSON.stringify(packet_continueScan)
          );
        }
      }
    }
    
    // 停止掃碼
    function stopScan() {
      let packet_stopScan = {
        action: "stopScan"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_stopScan)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.stopScan(
            JSON.stringify(packet_stopScan)
          );
        }
      }
    }

    // 開啟手機系統設定
    function openSettingPage() {
      let packet_openSettingPage = {
        action: "openSettingPage"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_openSettingPage)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.openSettingPage(
            JSON.stringify(packet_openSettingPage)
          );
        }
      }
    }

    // 從相簿選擇
    function chooseFromAlbum() {
      let packet_chooseFromAlbum = {
        action: "chooseFromAlbum"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_chooseFromAlbum)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.chooseFromAlbum(
            JSON.stringify(packet_chooseFromAlbum)
          );
        }
      }
    }

    // 調到最亮
    function setBrightest() {
      let packet_setBrightest = {
        action: "setBrightest"
      };

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_setBrightest)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.setBrightest(
            JSON.stringify(packet_setBrightest)
          );
        }
      }
    }

    // 調回原亮度
    function setOriginalBrightness(brightest) {
      let packet_setOriginalBrightnessData = {
        orignal: brightest
      };

      let packet_setOriginalBrightness = {
        action: "setOriginalBrightness",
        data: packet_setOriginalBrightnessData
      };

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_setOriginalBrightness)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.setOriginalBrightness(
            JSON.stringify(packet_setOriginalBrightness)
          );
        }
      }
    }

    // exitApp
    function exitApp() {
      let packet_exitApp = {
        action: "exitApp"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_exitApp)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.exitApp(
            JSON.stringify(packet_exitApp)
          );
        }
      }
    }


    //=========================收JS=========================//

    // 取得掃碼結果
    function onScan(data) {
      document.getElementById("getPhotoResult").innerText = "";
      document.getElementById("getPhotoResultTime").innerText = "";

      document.getElementById("getScanResult").innerText = "[掃碼結果]\n" + "rt:" + data["rt"] + "\nmsg:" + data["msg"] + "\ndata:" + data["data"];
      document.getElementById("getScanResultTime").innerText = new Date().toLocaleTimeString();
    }

    // 取得讀碼結果
    function onChooseFromAlbum(data) {
      document.getElementById("getScanResult").innerText = "";
      document.getElementById("getScanResultTime").innerText = "";

      document.getElementById("getPhotoResult").innerText = "[讀碼結果]\n" + "rt:" + data["rt"] + "\nmsg:" + data["msg"] + "\ndata:" + data["data"];"讀碼結果:\n" + data["data"];
      document.getElementById("getPhotoResultTime").innerText = new Date().toLocaleTimeString();
    }
  </script>
</body>  
</html>
