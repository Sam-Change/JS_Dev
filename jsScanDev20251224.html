<!-- jsDev -->
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>jsDev</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed; /* 關鍵：避免超出 */
    }

    th, td {
      border: 1px solid #333;
      padding: 6px;
      vertical-align: top;
      font-size: 14px;
      word-break: break-all;      /* 強制斷行 */
      overflow-wrap: break-word;  /* 長字串換行 */
    }

    th {
      text-align: center;
      font-weight: bold;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .col-title {
      width: 30%;
    }

    .col-content {
      width: 70%;
    }

    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
    }

    .time {
      font-size: 12px;
      color: gray;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <table>
    <thead>
        <tr>
            <th colspan="2">jsScanDev12241720</th>
        </tr>
    </thead>
    <tbody>
        <tr>
          <td colspan="2">
            <img src="https://raw.githubusercontent.com/Sam-Change/JS_Dev/5e1161f9161c1896cfca1c67119710f1ad2b0eaf/imgTest01.png">
          </td>
        </tr>
        <tr>
          <td class="col-title">
            取得掃碼結果
            <div id="currentTime" class="time"></div>
          </td>
          <td class="col-content" id="getScanResult">
            尚未掃碼
          </td>
        </tr>
        
        <tr>
          <td colspan="2">
            <button onclick="startScan()">開啟相機開始掃碼startScan</button>
          </td>
        </tr>

        <tr>
          <td colspan="2">
            <button onclick="continueScan()">繼續掃碼continueScan</button>
          </td>
        </tr>

        <tr>
          <td colspan="2">
            <button onclick="stopScan()">停止掃碼stopScan</button>
          </td>
        </tr>

        <tr>
          <td colspan="2">
            <button onclick="setScanType('QR')">設定QRCode掃碼格式setScanType</button>
          </td>
        </tr>

        <tr>
          <td colspan="2">
            <button onclick="setScanType('Barcode')">設定Barcode掃碼格式setScanType</button>
          </td>
        </tr>

        <tr>
          <td colspan="2">
            <button onclick="exitApp()">exitApp</button>
          </td>
        </tr>
    </tbody>
  </table>
  
  <script>
    var ideviceCheck = isiOSDevice();

    function isiOSDevice() {
      const mobileDevice = ['iPhone', 'iPad', 'iPod'];
      return mobileDevice.some(e => navigator.userAgent.match(e));
    }

    //=========================發JS=========================//

    // 開啟相機開始掃碼
    function startScan() {
      let packet_startScan = {
        action: "startScan"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_startScan)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.startScan(
            JSON.stringify(packet_startScan)
          );
        }
      }
    }

    // 繼續掃碼
    function continueScan() {
      let packet_continueScan = {
        action: "continueScan"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_continueScan)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.continueScan(
            JSON.stringify(packet_continueScan)
          );
        }
      }
    }
    
    // 停止掃碼
    function stopScan() {
      let packet_stopScan = {
        action: "stopScan"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_stopScan)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.stopScan(
            JSON.stringify(packet_stopScan)
          );
        }
      }
    }

    // 設定掃描QRCode格式
    function setScanType(type) {
      let packet_setScanTypeData = {
        type: type
      };

      let packet_setScanType = {
        action: "setScanType",
        data: packet_setScanTypeData
      };

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_setScanType)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.setScanType(
            JSON.stringify(packet_setScanType)
          );
        }
      }
    }

    // exitApp
    function exitApp() {
      let packet_exitApp = {
        action: "exitApp"
      }

      if (ideviceCheck) {
        window.webkit.messageHandlers.nativeHandler.postMessage(
          JSON.stringify(packet_exitApp)
        );
      }
      else {
        if (window.nativeHandler) {
          window.nativeHandler.exitApp(
            JSON.stringify(packet_exitApp)
          );
        }
      }
    }


    //=========================收JS=========================//

    // 取得掃碼結果
    function getScanResult(data) {
      document.getElementById("getScanResult").innerText = "掃碼結果:\n" + data["result"];
      document.getElementById("currentTime").innerText = new Date().toLocaleTimeString();
    }
  </script>
</body>  
</html>
