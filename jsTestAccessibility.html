<!--
jstoapp 登出 走現行onReLogin重複登入 或 onTimeOut逾時?
jstoapp 轉跳功能提供參數、功能代碼 有需要？
jstoapp 叫APP提供資料(APP處理過的資料)
切換無障礙 叫起url串參數在後面重load header塞是否為無障礙flag
jstoweb goBack通知網頁回上一頁
jstoweb rtA11yRtWeb通知主導權回網頁(帶APP處理的參數回去。若是web自行暫存的走現行setKeepdata、getKeepdata存取)
jstoweb timeout登出回首頁 需通知? -->

  <script>
    // 判斷是iOS還是Android
    var ideviceCheck = isiOSDevice()
    function isiOSDevice() {
      const mobileDevice = ['iPhone', 'iPad', 'iPod']
      let isMobileDevice = mobileDevice.some(e => navigator.userAgent.match(e))
      return isMobileDevice
    }
    
    // (無障礙)登入
    let packet_a11yLoginData = {
      "data": "",
    }

    let packet_a11yLogin = {
      "type": "a11yLogin",
      "data": JSON.stringify(packet_a11yLoginData),
    }

    function a11yLogin() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_a11yLogin);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify(packet_a11yLoginData);
          jstoapp.a11yLogin(action);
        }
      }
    }

    // (無障礙)切回一般版
    let packet_a11yChangeNormalVer = {
      "type": "a11yChangeNormalVer",
    }

    function a11yChangeNormalVer() {

        var action = JSON.stringify(packet_a11yChangeNormalVer);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify();
          jstoapp.a11yChangeNormalVer(action);
        }
      }
    }

    // (無障礙)轉跳更多
    let packet_a11yGoFuncMoreData = {
      "funcList": [{"funcID": "A01", "funcName": "活存帳戶總覽",},
                   {"funcID": "A02", "funcName": "交易明細查詢",},
                   {"funcID": "B01", "funcName": "臺幣存款利率",},
                   {"funcID": "B02", "funcName": "外幣存款利率",},],
      "moreList": [
                    {"folderName": "台幣服務", 
                     "folderFuncList": [{"funcID": "A01", "funcName": "活存帳戶總覽",},
                                        {"funcID": "A02", "funcName": "交易明細查詢",},]},
                    {"folderName": "金融資訊", 
                     "folderFuncList": [{"funcID": "B01", "funcName": "臺幣存款利率",},
                                        {"funcID": "B02", "funcName": "外幣存款利率",},]},
                  ]
    }

    let packet_a11yGoFuncMore = {
      "type": "a11yGoFuncMore",
      "data": JSON.stringify(packet_a11yGoFuncMoreData),
    }

    function a11yGoFuncMore() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_a11yGoFuncMore);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify(packet_a11yGoFuncMoreData);
          jstoapp.a11yGoFuncMore(action);
        }
      }
    }
    
    // (無障礙)轉跳快登快交設定頁
    let packet_a11yGoFuncQuickUseSetting = {
      "type": "a11yGoFuncQuickUseSetting",
    }

    function a11yGoFuncQuickUseSetting() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_a11yGoFuncQuickUseSetting);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify();

        }
      }
    }

    // 設定標題
    let packet_updateTitleData = {
      "Title": "無障礙測試標題",
      "canBack": "Y",
    }

    let packet_updateTitle = {
      "type": "updateTitle",
      "data": JSON.stringify(packet_updateTitleData),
    }

    function updateTitle() {
      if (ideviceCheck) {

        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {

          jstoapp.updateTitle(action);
        }
      }
    }

    // (無障礙)顯示隱藏標題列
    let packet_a11yGoSetNavBarNData = {
      "show": "N",
    }

    let packet_a11yGoSetNavBarN = {
      "type": "a11yGoSetNavBar",
      "data": JSON.stringify(packet_a11yGoSetNavBarNData),
    }

    function a11yGoSetNavBarN() {

    let packet_a11yGoSetNavBarYData = {

    // 收JS
    function rtA11yRtWeb(data) {
      document.getElementById("rtA11yRtWeb").innerText = "收到資料:" + data["data"];
    }
