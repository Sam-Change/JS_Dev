    var ideviceCheck = isiOSDevice()

    function isiOSDevice() {
      const mobileDevice = ['iPhone', 'iPad', 'iPod']
      let isMobileDevice = mobileDevice.some(e => navigator.userAgent.match(e))
      return isMobileDevice

    let packet_showShareDialog = {
      "type": "showShareDialog",
      "data": JSON.stringify(packet_showShareDialogData),
    }

    function showShareDialog() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_showShareDialog);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify(packet_showShareDialogData);
          jstoapp.showShareDialog(action);
        }
      }
    }
