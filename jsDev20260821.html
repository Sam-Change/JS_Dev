<!-- jsDev -->
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>jsDev</title>
</head>

<body>
  <!--畫面組成-->
  <table class="screenWidth border">
    <thead>
        <tr>
            <th colspan="2">jsDev08281040</th>
        </tr>
    </thead>
    <tbody>
        <tr>
          <img src="https://raw.githubusercontent.com/Sam-Change/JS_Dev/5e1161f9161c1896cfca1c67119710f1ad2b0eaf/imgTest04.png" width="414" height="120">
        </tr>
        <tr>
            <td class="screenWidth20% border textFormat">rtAppdata取得結果</td>
            <td class="screenWidth80% border textFormat" id="rtAppdata"></td>
        </tr>
        <tr>
            <td class="screenWidth20% border textFormat">rtEyesOn</td>
            <td class="screenWidth80% border textFormat" id="rtEyesOnResult"></td>
        </tr>
        <tr>
            <td><button onclick="setNavBar('預約查詢/取消','Y','Y','','Y','Y')">設定web第一頁標題</button><td>
        </tr>
        <tr>
            <td><button onclick="setNavBar('預約資料編輯','Y','Y','1/4','','N')">設定web第二頁標題</button><td>
        </tr>
        <tr>
            <td><button onclick="setNavBar('預約查詢取消結果','N','N','4/4','','N')">設定web結果頁標題</button><td>
        </tr>
        <tr> 
            <td><button onclick="goPreview()">回前一頁goPreview</button><td>
        </tr>
        <tr> 
            <td><button onclick="onLoadingTest()">顯示onLoading</button><td>
        </tr>
        <tr> 
            <td><button onclick="showPopWeb('新聞','https://news.ltn.com.tw/news/life/breakingnews/5546822')">開popWeb畫面showPopWeb</button><td>
        </tr>
        <tr>
            <td><button onclick="goFunc()">轉跳功能goFunc</button><td>
        </tr>
        <tr> 
            <td><button onclick="getKeepdata()">取得傳遞資料getKeepdata</button><td>
        </tr>
        <tr> 
            <td><button onclick="setAppdata('WB_isOn','Y')">存手機端資料setAppdata</button><td>
        </tr>
        <tr> 
            <td><button onclick="getAppdata('WB_isOn')">取得手機端資料getAppdata</button><td>
        </tr>
        <tr> 
            <td><button onclick="openUri()">外開URL openUri</button><td>
        </tr>
        <tr> 
            <td><button onclick="goHome()">回首頁goHome</button><td>
        </tr>
    </tbody>
  </table>
  
  <script>
    let bEyesOn = document.getElementById("rtEyesOn").innerText
    let pageCount = 1;

    var ideviceCheck = isiOSDevice()

    function isiOSDevice() {
      const mobileDevice = ['iPhone', 'iPad', 'iPod']
      let isMobileDevice = mobileDevice.some(e => navigator.userAgent.match(e))
      return isMobileDevice
    }

    function setNavBar(titleV, canBackV, showEyesV, rightMsgV, showFuncMenuV, isFirstPageV) {

      if (isFirstPageV === 'Y') {
        pageCount = 1;
      }
      else {
        if (titleV === '預約查詢取消結果') {
          pageCount = 4;
        }
        else {
          pageCount = 2;
        }
      }

      document.getElementById("title").innerText = titleV

      const packet_setNavBarData = {
        title: titleV,
        canBack: canBackV,
        showEyes: showEyesV,
        isEyesOn: bEyesOn,
        rightMsg: rightMsgV,
        showFuncMenu: showFuncMenuV,
        isFirstPage: isFirstPageV,
      };

      const packet_setNavBar = {
        type: "setNavBar",
        data: JSON.stringify(packet_setNavBarData),
      };

      console.log("packet_setNavBarData =", packet_setNavBarData);
      console.log("packet_setNavBar =", JSON.stringify(packet_setNavBar));

      if (ideviceCheck) {
        window.webkit.messageHandlers.jstoapp.postMessage(
          JSON.stringify(packet_setNavBar)
        );
      }
      else {
        if (window.jstoapp) {
          window.jstoapp.setNavBar(
            JSON.stringify(packet_setNavBarData)
          );
        }
      }
    }

    function goPreview() {
      let packet_goPreview = {
        "type": "goPreview",
      }

      if (ideviceCheck) {
        var action = JSON.stringify(packet_goPreview);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          jstoapp.packet_goPreview();
        }
      }
    }


    function onLoadingTest() {
      onLoading('Y','交易進行中請勿關閉畫面');

      // 5秒後關掉
      setTimeout(function() { 
        onLoading('N',''); 
      }, 5000);
    }

    function onLoading(openV, msgV) {

      const packet_onLoadingData = {
        open: openV,
        msg: msgV,
      };

      const packet_onLoading = {
        type: "onLoading",
        data: JSON.stringify(packet_onLoadingData),
      };

      if (ideviceCheck) {
        window.webkit.messageHandlers.jstoapp.postMessage(
          JSON.stringify(packet_onLoading)
        );
      }
      else {
        if (window.jstoapp) {
          window.jstoapp.onLoading(
            JSON.stringify(packet_onLoadingData)
          );
        }
      }
    }

    function showPopWeb(titleV, uriV) {

      const packet_showPopWebData = {
        title: titleV,
        uri: uriV,
      };

      const packet_showPopWeb = {
        type: "showPopWeb",
        data: JSON.stringify(packet_showPopWebData),
      };

      if (ideviceCheck) {
        window.webkit.messageHandlers.jstoapp.postMessage(
          JSON.stringify(packet_showPopWeb)
        );
      }
      else {
        if (window.jstoapp) {
          window.jstoapp.showPopWeb(
            JSON.stringify(packet_showPopWebData)
          );
        }
      }
    }

    function goFunc() {
      const inputValue = document.getElementById("funcInput").value || "100000"; // 預設值為100000
      
      const packet_goFuncData = {
        "FuncNo": inputValue
      };

      const packet_goFunc = {
        "type": "goFunc",
        "data": JSON.stringify(packet_goFuncData),
      };

      if (ideviceCheck) {
        var action = JSON.stringify(packet_goFunc);
        window.webkit?.messageHandlers?.jstoapp?.postMessage(action);
      } 
      else {
        if (typeof jstoapp !== "undefined" && jstoapp.goFunc) {
          var action = JSON.stringify(packet_goFuncData);
          jstoapp.goFunc(action);
        }
      }
    }

    // 取得傳遞資料
    let packet_getKeepdata = {
      "type": "getKeepdata",
    }

    function getKeepdata() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_getKeepdata);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          jstoapp.getKeepdata();
        }
      }
    }
    

    function setAppdata(titleV, dataV) {

      const packet_setAppdataData = {
        title: titleV,
        data: dataV,
      };

      const packet_setAppdata = {
        type: "setAppdata",
        data: JSON.stringify(packet_setAppdataData),
      };

      if (ideviceCheck) {
        window.webkit.messageHandlers.jstoapp.postMessage(
          JSON.stringify(packet_setAppdata)
        );
      }
      else {
        if (window.jstoapp) {
          window.jstoapp.setAppdata(
            JSON.stringify(packet_setAppdataData)
          );
        }
      }
    }
    
    function getAppdata(titleV) {

      const packet_getAppdataData = {
        title: titleV,
      };

      const packet_getAppdata = {
        type: "getAppdata",
        data: JSON.stringify(packet_getAppdataData),
      };

      if (ideviceCheck) {
        window.webkit.messageHandlers.jstoapp.postMessage(
          JSON.stringify(packet_getAppdata)
        );
      }
      else {
        if (window.jstoapp) {
          window.jstoapp.getAppdata(
            JSON.stringify(packet_getAppdataData)
          );
        }
      }
    }

    //回首頁
    let packet_goHome = {
      "type": "goHome",
    }

    function goHome() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_goHome);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          jstoapp.goHome();
        }
      }
    }

    //外開URL
    let packet_openUriData = {
      "url": "https://www.cwa.gov.tw/V8/C/"
    }

    let packet_openUri = {
      "type": "openUri",
      "data": JSON.stringify(packet_openUriData),
    }

    function openUri() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_openUri);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify(packet_openUriData);
          jstoapp.openUri(action);
        }
      }
    }

    // 暫存資料在APP端
    let packet_setKeepdataData = {
      "id": "390100",
      "HaveLine": "N",
      "StatusCode": "0000",
      "LOGINTYPE": "MB",
      "SystemID": "NB",
      "HavePhone": "Y",
      "CustomerID": "A100000000",
      "HaveEmail": "N",
      "StatusDesc": "OK",
      "msgCode": "0",
      "resultCode": true,
    }

    let packet_setKeepdata = {
      "type": "setKeepdata",
      "data": JSON.stringify(packet_setKeepdataData),
    }

    function setKeepdata() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_setKeepdata);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify(packet_setKeepdataData);
          jstoapp.setKeepdata(action);
        }
      }
    }

    // 收JS
    function rtKeepdata(data) {
      document.getElementById("rtKeepdata").innerText = "傳遞參數:" + data["data"];
    }

    function rtAppdata(data) {
      console.log("rtAppdata =", data);
      document.getElementById("rtAppdata").innerText = "手機端儲存參數:" + data["title"] + ", 值:" + data["data"];
    }

    function rtEyesOn(data) {
      console.log("rtEyesOn = ", data);
      document.getElementById("rtEyesOn").innerText = data["eyesOn"];

      if (data["eyesOn"] === 'Y') {
        document.getElementById("rtEyesOnResult").innerText = 'rtEyesOn=' + data["eyesOn"] + ', $*****'
      }
      else {
        document.getElementById("rtEyesOnResult").innerText = 'rtEyesOn=' + data["eyesOn"] + ', $8,786,334'
      }
      setNavBar(document.getElementById("title").innerText,'Y','Y','','Y','Y')
    }

    function goBack() {
      if (pageCount === 1) {
        goPreview()
      }
      else if (pageCount === 2) {
        setNavBar('預約查詢/取消','Y','N','','Y','Y')
      }
    }
  </script>
</body>
  
<style>
  .textFormat {
    font-size: 14;
  }

  .screenWidth {
    width: screen.width;
  }
  
  .screenWidth20% {
    width: screen.width*20%;
  }

  .screenWidth50% {
    width: screen.width*50%;
  }

  .screenWidth80% {
    width: screen.width*80%;
  }

  .border {
    border: 1px solid #333;
  }

</style>
  
</html>
