<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8; width=device-width; initial-scale=1.0">
  <title>jsSample</title>
</head>

<body>
  <table class="screenWidth border">
    <thead>
        <tr>
            <th colspan="2">jsSample 2404151400</th>
        </tr>
    </thead>
    <tbody>
        <tr>
        </tr>
        <tr> 
            <td><button onclick="setData()">setData</button><td>
        </tr>
        <tr>
            <td><button onclick="getData()">getData</button><td>
        </tr>
        <tr>
            <td>結果</td>
            <td id="result"></td>
        </tr>
    </tbody>
  </table>
  
  <script>
    var ideviceCheck = isiOSDevice()

    function isiOSDevice() {
      const mobileDevice = ['iPhone', 'iPad', 'iPod']
      let isMobileDevice = mobileDevice.some(e => navigator.userAgent.match(e))
      return isMobileDevice
    }
    
    let packet_setDataData = {
      "data": "012345678900000"
    }

    let packet_setData = {
      "type": "setData",
      "data": JSON.stringify(packet_setDataData),
    }

    function setData() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_setData);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify(packet_setDataData);
          jstoapp.setData(action);
        }
      }
    }

    

    let packet_getData = {
      "type": "getData"
    }

    function getData() {
      if (ideviceCheck) {
        var action = JSON.stringify(packet_getData);
        window.webkit.messageHandlers.jstoapp.postMessage(action);
      }
      else {
        if (jstoapp) {
          var action = JSON.stringify();
          jstoapp.getData(action);
        }
      }
    }

    // 收JS
    function rtData(data) {
      document.getElementById("result").innerText = data["data"];
    }
  </script>
</body>
  
<style>
  .textFormat {
    font-size: 14;
  }

  .screenWidth {
    width: screen.width;
  }
  
  .screenWidth20% {
    width: screen.width*20%;
  }

  .screenWidth50% {
    width: screen.width*50%;
  }

  .screenWidth80% {
    width: screen.width*80%;
  }

  .border {
    border: 1px solid #333;
  }

</style>
  
</html>
